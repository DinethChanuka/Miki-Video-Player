name: CI/CD Pipeline & Cross-Platform Distribution (Windows, Linux, Android, iOS)

on:
  push:
    branches: [ "main", "master", "feat/**", "fix/**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. CI QUALITY & TEST GATE
  # =========================================================================
  ci-quality-gate:
    name: 🧪 CI Quality Gate (TypeCheck, Tests & Web Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Restore Packaged macOS Bundle for Test Verification
        run: |
          if [ -f "Build/MacOs/Miki-Player-macOS.zip" ] && [ ! -d "Build/MacOs/Miki Player.app" ]; then
            unzip -q -o "Build/MacOs/Miki-Player-macOS.zip" -d "Build/MacOs" || true
          fi

      - name: Run TypeScript Type Check & Application Tests
        run: npm test
        env:
          NODE_OPTIONS: "--experimental-strip-types"

      - name: Build Web Production Bundle
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -d dist || { echo "❌ dist folder missing"; exit 1; }
          test -f dist/index.html || { echo "❌ dist/index.html missing"; exit 1; }
          echo "✅ Web production bundle verified successfully!"

      - name: Upload Web Production Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Miki-Player-Web-Production
          path: dist/
          if-no-files-found: error

  # =========================================================================
  # 2. SECURITY AUDIT & INTEGRITY CHECKUP
  # =========================================================================
  security-checkup:
    name: 🛡️ Security Audit & Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Dependency Vulnerability Audit
        run: npm audit --audit-level=high

      - name: Scan Repository for Sensitive Files & Secrets
        run: |
          echo "🔍 Scanning for accidental secret leakage..."
          FORBIDDEN_FILES=(".env" ".env.local" ".env.production" "id_rsa" "id_ed25519" "private.key")
          for file in "${FORBIDDEN_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "❌ ERROR: Sensitive file '$file' found in repository root!"
              exit 1
            fi
          done
          echo "✅ Security integrity checkup passed!"

  # =========================================================================
  # 3. PLATFORM BUILDS (Gated behind CI Quality & Security)
  # =========================================================================
  build-macos-app:
    name: Build macOS Desktop Application (.app & .zip)
    needs: [ci-quality-gate, security-checkup]
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Bundle & Native macOS Application
        run: ./scripts/package-mac.sh

      - name: Verify macOS Application Artifacts
        run: |
          test -d "Build/MacOs/Miki Player.app" || { echo "❌ Miki Player.app missing"; exit 1; }
          test -f "Build/MacOs/Miki-Player-macOS.zip" || { echo "❌ Miki-Player-macOS.zip missing"; exit 1; }
          echo "✅ macOS Desktop Application bundle verified successfully!"

      - name: Upload macOS Application Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Miki-Player-macOS-Desktop
          path: |
            Build/MacOs/Miki Player.app
            Build/MacOs/Miki-Player-macOS.zip

  build-windows-exe:
    name: Build Windows Standalone (.exe & .msi)
    needs: [ci-quality-gate, security-checkup]
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Bundle
        run: npm run build

      - name: Build Windows Standalone (.exe) via Tauri
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Stage Windows Executables
        shell: bash
        run: |
          mkdir -p Build/windows
          cp src-tauri/target/release/*.exe Build/windows/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/nsis/*.exe Build/windows/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/msi/*.msi Build/windows/ 2>/dev/null || true

      - name: Verify Windows Artifacts
        shell: bash
        run: |
          count=$(ls Build/windows/*.exe Build/windows/*.msi 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "❌ No Windows .exe or .msi artifacts found in Build/windows"
            exit 1
          fi
          echo "✅ Windows executable artifacts verified: $count files found."

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Miki-Player-Windows-x64
          path: Build/windows/
          if-no-files-found: warn

  build-linux-appimage:
    name: Build Linux Binary (.AppImage, .deb & .iso)
    needs: [ci-quality-gate, security-checkup]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev genisoimage xorriso

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Bundle & Tauri Binary
        run: |
          npm run build
          npx tauri build

      - name: Generate Linux Distribution ISO & Package
        run: |
          mkdir -p Build/Linux iso_root
          cp -r dist iso_root/
          cp -r src-tauri/target/release/bundle/appimage/*.AppImage iso_root/ 2>/dev/null || true
          cp -r src-tauri/target/release/bundle/deb/*.deb iso_root/ 2>/dev/null || true
          genisoimage -o Build/Linux/Miki-Player-Linux-v0.2.0.iso -R -J -V "MikiPlayer" iso_root/ || true
          cp -r src-tauri/target/release/bundle/appimage/*.AppImage Build/Linux/ 2>/dev/null || true
          cp -r src-tauri/target/release/bundle/deb/*.deb Build/Linux/ 2>/dev/null || true

      - name: Verify Linux Artifacts
        run: |
          count=$(ls Build/Linux/*.AppImage Build/Linux/*.deb Build/Linux/*.iso 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "❌ No Linux distribution packages found in Build/Linux"
            exit 1
          fi
          echo "✅ Linux distribution packages verified: $count files found."

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Miki-Player-Linux-x86_64
          path: Build/Linux/
          if-no-files-found: warn

  build-android-apk:
    name: Build Android APK (Release & Debug)
    needs: [ci-quality-gate, security-checkup]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Configure Android SDK Environment & Licenses
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Stable & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Web Bundle
        run: npm run build

      - name: Package Android APK
        run: |
          mkdir -p Build/Android
          ./scripts/package-android.sh
          find . -name "*.apk" -not -path "*/node_modules/*" -exec cp {} Build/Android/ \; 2>/dev/null || true
          touch Build/Android/.gitkeep

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Miki-Player-Android-APK
          path: Build/Android/
          if-no-files-found: warn

  build-ios-app:
    name: Build iOS Application (.ipa / .app)
    needs: [ci-quality-gate, security-checkup]
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Stable & iOS Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Web Bundle
        run: npm run build

      - name: Package iOS Application
        run: |
          mkdir -p Build/ios
          ./scripts/package-ios.sh
          find . -name "*.ipa" -not -path "*/node_modules/*" -exec cp {} Build/ios/ \; 2>/dev/null || true
          touch Build/ios/.gitkeep

      - name: Upload iOS Application Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Miki-Player-iOS-Bundle
          path: Build/ios/
          if-no-files-found: warn
